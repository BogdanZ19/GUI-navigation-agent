[project]
name = "gui-agent"
version = "0.1.0"
description = "GUI navigation agent"
readme = "README.md"
authors = [
    { name = "BogdanZ19", email = "bogdanzainia1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mss>=10.2.0",
    "pywin32>=312"
]

[project.optional-dependencies]
dev = ["pytest>=9.0.2"]

[project.scripts]
gui-agent = "gui_agent.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
